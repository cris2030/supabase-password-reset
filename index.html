<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabase = createClient(
      'https://malijhcucevviswcilxy.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hbGlqaGN1Y2V2dmlzd2NpbHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc5MjUyODQsImV4cCI6MjA2MzUwMTI4NH0.sgJNBtbreFtwktKPuawCpjyHTwU2_SSZxojjTseme7Q'
    )

    window.addEventListener('load', async () => {
      const hash = window.location.hash
      const params = new URLSearchParams(hash.substring(1))
      const accessToken = params.get('access_token')

      if (!accessToken) {
        document.getElementById('status').textContent = 'Token no válido.'
        return
      }

      // Inicia sesión temporalmente
      const { error } = await supabase.auth.setSession({
        access_token: accessToken,
        refresh_token: '' // No es necesario para reset
      })

      if (error) {
        document.getElementById('status').textContent = 'Error iniciando sesión con token.'
        return
      }

      document.getElementById('form').style.display = 'block'

      document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault()
        const newPassword = document.getElementById('new-password').value

        const { error } = await supabase.auth.updateUser({
          password: newPassword
        })

        if (error) {
          document.getElementById('status').textContent = 'Error actualizando contraseña.'
        } else {
          document.getElementById('status').textContent = 'Contraseña actualizada con éxito. Puedes cerrar esta página.'
          document.getElementById('form').style.display = 'none'
        }
      })
    })
    </script>
</head>
<body>
    <h1>Restablecer Contraseña</h1>
    <div id="form" style="display: none;">
        <form id="reset-form">
            <label for="new-password">Nueva contraseña:</label>
            <input type="password" id="new-password" required />
            <button type="submit">Actualizar</button>
        </form>
    </div>
    <p id="status">Cargando...</p>
</body>
</html>
