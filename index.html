<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transerco | Confirmación / Restablecer Contraseña</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #e0f7fa, #b2ebf2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        h1 {
            color: #0077b6;
            margin-bottom: 1rem;
            text-align: center;
        }

        #form, #welcome {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            display: none;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }

        button {
            background-color: #00b4d8;
            color: white;
            padding: 0.75rem;
            width: 100%;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

            button:hover {
                background-color: #0077b6;
            }

        #status {
            margin-top: 1rem;
            color: #d62828;
            font-weight: 500;
            text-align: center;
        }

        .success {
            color: #2e7d32;
        }
    </style>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabase = createClient(
            'https://malijhcucevviswcilxy.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hbGlqaGN1Y2V2dmlzd2NpbHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc5MjUyODQsImV4cCI6MjA2MzUwMTI4NH0.sgJNBtbreFtwktKPuawCpjyHTwU2_SSZxojjTseme7Q'
        )

        window.addEventListener('load', async () => {
            const params = new URLSearchParams(window.location.hash.substring(1))
            const type = params.get('type')

            const statusEl = document.getElementById('status')
            const form = document.getElementById('form')
            const welcome = document.getElementById('welcome')

            if (!type) {
                statusEl.textContent = 'No se pudo determinar la acción.'
                return
            }

            if (type === 'signup') {
                // Mostrar mensaje de confirmación de correo
                welcome.style.display = 'block'
                statusEl.textContent = 'Correo confirmado con éxito. ¡Ya puedes iniciar sesión!'
                statusEl.classList.add('success')
                return
            }

            if (type === 'recovery') {
                // Mostrar formulario de restablecimiento
                form.style.display = 'block'
                statusEl.textContent = ''

                document.getElementById('reset-form').addEventListener('submit', async (e) => {
                    e.preventDefault()

                    const newPassword = document.getElementById('new-password').value
                    if (newPassword.length < 6) {
                        statusEl.textContent = 'La contraseña debe tener al menos 6 caracteres.'
                        return
                    }

                    statusEl.textContent = 'Actualizando contraseña...'

                    try {
                        // ⚠️ IMPORTANTE: este método requiere que el usuario tenga sesión activa
                        // Si no tiene sesión, debes hacer la recuperación a través de un backend seguro
                        const { error } = await supabase.auth.updateUser({ password: newPassword })

                        if (error) {
                            statusEl.textContent = 'No se pudo actualizar la contraseña. Por favor inicia sesión primero.'
                        } else {
                            statusEl.textContent = '✅ Contraseña actualizada correctamente.'
                            statusEl.classList.add('success')
                            form.style.display = 'none'
                        }
                    } catch (err) {
                        statusEl.textContent = 'Ocurrió un error inesperado.'
                        console.error(err)
                    }
                })
                return
            }

            // Tipo desconocido
            statusEl.textContent = 'Tipo de acción desconocido.'
        })
    </script>
</head>
<body>
    <h1>Transerco</h1>

    <!-- Formulario para reset -->
    <div id="form">
        <form id="reset-form">
            <label for="new-password">Nueva contraseña</label>
            <input type="password" id="new-password" required placeholder="Escribe tu nueva contraseña" />
            <button type="submit">Actualizar contraseña</button>
        </form>
    </div>

    <!-- Mensaje para confirmación -->
    <div id="welcome">
        <p>¡Tu cuenta ha sido confirmada exitosamente! 🎉</p>
        <p>Ya puedes cerrar esta página e ingresar a la aplicación de <strong>Transerco</strong>.</p>
    </div>

    <p id="status">Cargando...</p>
</body>
</html>
