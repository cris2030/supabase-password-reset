<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transerco | Confirmación / Restablecer Contraseña</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #e0f7fa, #b2ebf2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        h1 {
            color: #0077b6;
            margin-bottom: 1rem;
            text-align: center;
        }

        #form, #welcome {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            display: none;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }

        button {
            background-color: #00b4d8;
            color: white;
            padding: 0.75rem;
            width: 100%;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

            button:hover {
                background-color: #0077b6;
            }

        #status {
            margin-top: 1rem;
            color: #d62828;
            font-weight: 500;
            text-align: center;
        }

        .success {
            color: #2e7d32;
        }
    </style>

    <script>
        window.addEventListener('load', async () => {

            const params = new URLSearchParams(window.location.hash.substring(1));
            const type = params.get('type');
            const access_token = params.get('access_token');
            const refresh_token = params.get('refresh_token');

            const statusEl = document.getElementById('status');
            const form = document.getElementById('form');
            const welcome = document.getElementById('welcome');

            if (!type) {
                statusEl.textContent = 'No se pudo determinar la acción.';
                return;
            }

            // --------------------------
            // 1. Confirmación de correo
            // --------------------------
            if (type === 'signup') {
                welcome.style.display = 'block';
                statusEl.textContent = 'Correo confirmado exitosamente.';
                statusEl.classList.add('success');
                return;
            }

            // --------------------------
            // 2. RECOVERY (RESET PASSWORD)
            // --------------------------
            if (type === 'recovery') {

                if (!access_token || !refresh_token) {
                    statusEl.textContent = 'Tokens no válidos o incompletos.';
                    return;
                }

                // Mostrar formulario
                form.style.display = 'block';
                statusEl.textContent = '';

                document.getElementById('reset-form').addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const newPassword = document.getElementById('new-password').value;

                    if (newPassword.length < 6) {
                        statusEl.textContent = 'La contraseña debe tener mínimo 6 caracteres.';
                        return;
                    }

                    statusEl.textContent = 'Actualizando contraseña...';

                    // --------------------------
                    // 🚀 LLAMADA A TU BACKEND
                    // --------------------------
                    const response = await fetch('https://supabaseapi-xz64.onrender.com/api/auth/reset-password/confirm', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            accessToken: access_token,
                            refreshToken: refresh_token,
                            newPassword: newPassword
                        })
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        statusEl.textContent = 'Error: ' + (result.message || 'No se pudo actualizar la contraseña.');
                        return;
                    }

                    statusEl.textContent = 'Contraseña actualizada correctamente.';
                    statusEl.classList.add('success');
                    form.style.display = 'none';
                });

                return;
            }

            statusEl.textContent = 'Acción desconocida.';
        });
    </script>
</head>

<body>
    <h1>Transerco</h1>

    <!-- Formulario para reset -->
    <div id="form">
        <form id="reset-form">
            <label for="new-password">Nueva contraseña</label>
            <input type="password" id="new-password" required placeholder="Escribe tu nueva contraseña" />
            <button type="submit">Actualizar contraseña</button>
        </form>
    </div>

    <!-- Mensaje para confirmación email -->
    <div id="welcome">
        <p>¡Tu cuenta ha sido confirmada exitosamente! 🎉</p>
        <p>Ya puedes cerrar esta página e ingresar a <strong>Transerco</strong>.</p>
    </div>

    <p id="status">Cargando...</p>
</body>
</html>
