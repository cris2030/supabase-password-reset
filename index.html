<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restablecer Contraseña</title>
    <style>
        /* Estilos base */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #e0f7fa, #b2ebf2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #0077b6;
            margin-bottom: 1rem;
        }

        #form {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }

        button {
            background-color: #00b4d8;
            color: white;
            padding: 0.75rem;
            width: 100%;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

            button:hover {
                background-color: #0077b6;
            }

        #status {
            margin-top: 1rem;
            color: #d62828;
            font-weight: 500;
            text-align: center;
        }

        .success {
            color: #2e7d32;
        }
    </style>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabase = createClient(
            'https://malijhcucevviswcilxy.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hbGlqaGN1Y2V2dmlzd2NpbHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc5MjUyODQsImV4cCI6MjA2MzUwMTI4NH0.sgJNBtbreFtwktKPuawCpjyHTwU2_SSZxojjTseme7Q'
        )

        window.addEventListener('load', async () => {
            const hash = window.location.hash
            const params = new URLSearchParams(hash.substring(1))

            const accessToken = params.get('access_token')
            const refreshToken = params.get('refresh_token')

            const statusEl = document.getElementById('status')

            if (!accessToken || !refreshToken) {
                statusEl.textContent = 'Token no válido o incompleto.'
                return
            }

            const { error: sessionError } = await supabase.auth.setSession({
                access_token: accessToken,
                refresh_token: refreshToken
            })

            if (sessionError) {
                statusEl.textContent = 'Error iniciando sesión con el token.'
                return
            }

            document.getElementById('form').style.display = 'block'

            document.getElementById('reset-form').addEventListener('submit', async (e) => {
                e.preventDefault()

                const newPassword = document.getElementById('new-password').value

                // Validación: mínimo 6 caracteres
                if (newPassword.length < 6) {
                    statusEl.textContent = 'La contraseña debe tener al menos 6 caracteres.'
                    return
                }

                const { error: updateError } = await supabase.auth.updateUser({
                    password: newPassword
                })

                if (updateError) {
                    statusEl.textContent = 'Error actualizando la contraseña.'
                } else {
                    statusEl.textContent = '✅ Contraseña actualizada con éxito. Ya puedes cerrar esta página.'
                    statusEl.classList.add('success')
                    document.getElementById('form').style.display = 'none'
                }
            })
        })
    </script>
</head>
<body>
    <h1>Restablecer Contraseña</h1>

    <div id="form" style="display: none;">
        <form id="reset-form">
            <label for="new-password">Nueva contraseña</label>
            <input type="password" id="new-password" required placeholder="Escribe tu nueva contraseña" />
            <button type="submit">Actualizar contraseña</button>
        </form>
    </div>

    <p id="status">Cargando...</p>
</body>
</html>
